<!-- Light/dark mode: follow the system setting on load, then the sidebar button
     is a plain light <-> dark toggle (Chirpy's own toggle cycles through a third
     "follow system" state, which our CSS renders as dark). -->
<script>
  (function () {
    var root = document.documentElement;
    var query = window.matchMedia('(prefers-color-scheme: dark)');

    function systemMode() {
      return query.matches ? 'dark' : 'light';
    }

    function apply(mode, remember) {
      root.setAttribute('data-mode', mode);
      try {
        if (remember) sessionStorage.setItem('mode', mode);
      } catch (e) {}
      window.postMessage({ id: 'theme-mode' }, '*');
    }

    // On load: keep a choice made earlier this session, otherwise use the system setting
    if (!root.hasAttribute('data-mode')) root.setAttribute('data-mode', systemMode());

    // Button: toggle between light and dark only
    if (window.Theme) {
      Theme.flip = function () {
        apply(root.getAttribute('data-mode') === 'dark' ? 'light' : 'dark', true);
      };
    }

    // If the OS setting changes mid-visit, Chirpy clears the mode; re-apply the new system one
    query.addEventListener('change', function () {
      apply(systemMode(), false);
    });
  })();
</script>

<!-- Mobile: swipe right to open the sidebar, swipe left to close it.
     Reuses the theme's own open/close (the hidden #sidebar-trigger and #mask). -->
<script>
  (function () {
    var mobile = window.matchMedia('(max-width: 849.98px)'); /* Chirpy's lg breakpoint */
    var MIN_DIST = 50; // px of horizontal travel needed
    var start = null;

    function isOpen() {
      return document.body.hasAttribute('sidebar-display');
    }

    // Don't hijack swipes on things that scroll sideways (code blocks, tables, ...)
    function inHorizontalScroller(el) {
      for (; el && el !== document.body; el = el.parentElement) {
        var ox = getComputedStyle(el).overflowX;
        if ((ox === 'auto' || ox === 'scroll') && el.scrollWidth > el.clientWidth) return true;
      }
      return false;
    }

    var LOCK_DIST = 10; // px of movement before we decide: sideways swipe or normal scroll
    var swipe = null; // { x, y, axis: null | 'x' | 'y' }

    document.addEventListener('touchstart', function (e) {
      if (!mobile.matches || e.touches.length !== 1 || inHorizontalScroller(e.target)) {
        swipe = null;
        return;
      }
      swipe = { x: e.touches[0].clientX, y: e.touches[0].clientY, axis: null };
    }, { passive: true });

    // Real thumbs never swipe perfectly sideways, and the browser would start
    // scrolling vertically. Decide the direction in the first few pixels; if it's
    // sideways, stop the browser scrolling for the rest of this swipe.
    // (Must be non-passive so preventDefault() is allowed.)
    document.addEventListener('touchmove', function (e) {
      if (!swipe) return;
      var dx = e.touches[0].clientX - swipe.x;
      var dy = e.touches[0].clientY - swipe.y;

      if (!swipe.axis) {
        if (Math.abs(dx) < LOCK_DIST && Math.abs(dy) < LOCK_DIST) return;
        swipe.axis = Math.abs(dx) > Math.abs(dy) ? 'x' : 'y';
      }

      if (swipe.axis === 'x' && e.cancelable) e.preventDefault();
    }, { passive: false });

    document.addEventListener('touchcancel', function () {
      swipe = null;
    }, { passive: true });

    document.addEventListener('touchend', function (e) {
      if (!swipe) return;
      var s = swipe;
      swipe = null;
      if (s.axis !== 'x') return;

      var dx = e.changedTouches[0].clientX - s.x;
      if (Math.abs(dx) < MIN_DIST) return;

      if (dx > 0 && !isOpen()) {
        var trigger = document.getElementById('sidebar-trigger');
        if (trigger) trigger.click();
      } else if (dx < 0 && isOpen()) {
        var mask = document.getElementById('mask');
        if (mask) mask.click();
      }
    }, { passive: true });
  })();
</script>
